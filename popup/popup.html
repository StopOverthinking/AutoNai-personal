<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AutoNai personal</title><link rel="stylesheet" href="popup.css"></head><body><section class="card" aria-label="AutoNai personal 반복 생성">
  <div class="presets" role="group" aria-label="생성 횟수">
    <button type="button" data-count="3" aria-pressed="true">3</button>
    <button type="button" data-count="5" aria-pressed="false">5</button>
    <button type="button" data-count="10" aria-pressed="false">10</button>
    <button type="button" data-count="20" aria-pressed="false">20</button>
  </div>
  <button id="toggle" class="toggle" type="button" aria-label="시작" title="Ctrl+Enter 시작 · Ctrl+Alt+Enter 중지">
    <span class="icon" aria-hidden="true"></span><span id="progress" class="progress">0 / 3</span>
  </button>
  <p id="status" class="status" role="status">준비 중…</p>
  <label class="notification-setting" title="반복 생성 완료 시 브라우저 알림 표시">
    <input id="completion-notification" type="checkbox" checked disabled>완료 알림
  </label>
  <p id="notification-status" class="status" role="status"></p>
</section><script src="popup.js"></script></body></html>
